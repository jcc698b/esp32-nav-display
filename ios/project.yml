name: NavDisplaySender
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  NavDisplaySender:
    type: application
    platform: iOS
    sources:
      - path: NavDisplaySender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NavDisplaySender
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NavDisplay
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 需要定位权限来规划路线、并计算实时转向指引。
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 需要蓝牙权限把导航信息发送到 ESP32 副屏。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO

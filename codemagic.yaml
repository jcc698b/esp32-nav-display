workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          cd ios
          brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        script: |
          cd ios
          xcodebuild \
            -project NavDisplaySender.xcodeproj \
            -target NavDisplaySender \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          cd ios
          APP="build/Release-iphoneos/NavDisplaySender.app"
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry NavDisplaySender-unsigned.ipa Payload
          ls -lh NavDisplaySender-unsigned.ipa

    artifacts:
      - ios/out/NavDisplaySender-unsigned.ipa

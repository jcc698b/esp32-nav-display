; ============================================================
;  ESP32-S3 + 2.8" ST7789 (240x320) 蓝牙导航副屏
;  PlatformIO 工程配置
;
;  用法：  pio run -t upload
;  串口：  pio device monitor
; ============================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform      = espressif32@6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---- Flash / 分区 -------------------------------------------------
; 默认按 8MB Flash 处理。如果是 N16R8（16MB + 8MB PSRAM）模块：
;   1) 把 flash_size 改成 16MB
;   2) 在 build_flags 里加一行 -DBOARD_HAS_PSRAM
;   3) 把 build_unflags 改成 -std=gnu++11（保持不变即可）
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv     ; 3MB 应用区，不用 OTA

; ---- 编译选项 -----------------------------------------------------
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -Wno-unused-variable

; ---- 依赖库（已验证的组合，不要随意升级）-------------------------
lib_deps =
    lovyan03/LovyanGFX@1.3.0
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.4.3
